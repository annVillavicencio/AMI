version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ami_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_SERVER=
      - DB_PORT=
      - DB_DATABASE=
      - DB_USER=
      - DB_PASSWORD=
      - DB_WINDOWS_AUTH=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
