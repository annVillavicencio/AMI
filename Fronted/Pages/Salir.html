<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMI - Cerrando sesión</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- CSS en línea para esta vista específica, manteniendo tu paleta -->
    <style>
        body {
            background-color: #0B0E14; /* Tu fondo oscuro principal */
            color: #F8FAFC;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .logout-container {
            text-align: center;
            background-color: #13171F; /* Fondo de tus tarjetas */
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        .brand-pink {
            color: #FFB3E6;
        }
    </style>

    <meta http-equiv="refresh" content="2.5;url=http://127.0.0.1:5500/AMI/Fronted/Login.html">
</head>
<body>

    <div class="logout-container">
        <div class="mb-4 text-center">
            <i class="bi bi-box-arrow-right brand-pink" style="font-size: 3rem;"></i>
        </div>
        
        <h4 class="fw-bold mb-2">¡Hasta pronto!</h4>
        <p class="text-muted small mb-4">Cerrando de forma segura tu sesión en AMI...</p>
        
        <!-- Animación de carga -->
        <div class="spinner-border brand-pink" role="status" style="width: 2rem; height: 2rem;">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <!-- Opción 2: Redirección con JavaScript (Por si prefieres manejarlo así cuando conectes el backend) -->
    <script>
        /*
        // Cuando conectes tu base de datos y backend, aquí podrías ejecutar
        // la limpieza del localStorage, sessionStorage o cookies antes de redirigir a tu página de login de Bootstrap.
        
        setTimeout(() => {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }, 2500); // 2500 milisegundos = 2.5 segundos
        */
    </script>
</body>
</html>
