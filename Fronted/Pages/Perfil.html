<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMI - Ver Perfil</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../CSS/style.css">
    <style>
        body { background-color: #0B1009; color: #EFF0EB; font-family: system-ui, -apple-system, sans-serif; }
        .card-custom { background-color: #121810; border: 1px solid rgba(255, 255, 255, 0.05); }
        .bg-sidebar { background-color: #101218; border-right: 1px solid rgba(255, 255, 255, 0.05); }
        
        .text-neon-green { color: #DBFF99 !important; }
        .bg-neon-green { background-color: #eaebe7 !important; color: #0B1009 !important; }
        .text-neon-pink { color: #FFD4F8 !important; }
        .bg-neon-pink { background-color: #FFD4F8 !important; color: #0B1009 !important; }
        .form-control-dark { background-color: #1A2218; border: 1px solid rgba(255,255,255,0.1); color: #EFF0EB; }
        .form-control-dark:focus { background-color: #1A2218; color: #EFF0EB; border-color: #DBFF99; box-shadow: none; }
        .btn-outline-green { border: 1px solid #DBFF99; color: #DBFF99; }
        .btn-outline-green:hover { background-color: rgba(219, 255, 153, 0.1); color: #DBFF99; }
        .table-dark-custom { --bs-table-bg: transparent; --bs-table-color: #EFF0EB; --bs-table-border-color: rgba(255,255,255,0.05); }
        .table-dark-custom th { font-weight: 600; color: #EFF0EB; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 1rem; }
        .table-dark-custom td { padding: 1rem 0.5rem; vertical-align: middle; border-bottom: none; }
        .placeholder-line { display: inline-block; width: 60%; height: 8px; background-color: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        
        .sidebar-link { color: #EFF0EB; transition: 0.2s; }
        .sidebar-link:hover { background-color: rgba(16, 18, 24); }
       .sidebar-active { background-color: #FFD4F8; color: #0B1009 !important; font-weight: bold; }
        .action-link { text-decoration: none; color: #EFF0EB; transition: 0.2s; }
        .action-link:hover { color: #DBFF99; }
        .page-btn { background-color: #101218; border: 1px solid rgba(16, 18, 24); color: #EFF0EB; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer;}
        .page-btn.active { background-color: #DBFF99; color: #101218; border-color: #DBFF99; font-weight: bold; }
         .page-btn.active {
            background-color: var(--neon-purple);
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple-glow);
        }
        .page-btn {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: #FFF;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .icon-box-purple { background: rgba(168, 85, 247, 0.15); color: var(--neon-purple); }
        .icon-box-lime { background: rgba(163, 230, 53, 0.15); color: var(--neon-lime); }
        .icon-box-blue { background: rgba(56, 189, 248, 0.15); color: var(--neon-blue); }
        .icon-box-dark { background: rgba(255, 255, 255, 0.05); color: var(--text-muted-custom); }
        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
         .table-custom {
            --bs-table-bg: transparent;
            --bs-table-color: #F9FAFB;
            --bs-table-border-color: var(--border-subtle);
        }
        .table-custom th {
            color: var(--text-muted-custom);
            font-weight: 500;
            font-size: 0.82rem;
            border-bottom-width: 1px;
        }
        .table-custom td {
            padding: 0.9rem 0.5rem;
            font-size: 0.88rem;
        }
        .badge-finalizada {
            border: 1px solid #4B5563;
            color: #9CA3AF;
            background: rgba(75, 85, 99, 0.15);
            font-weight: 500;
            padding: 0.35em 0.8em;
        }
        .badge-activa {
            border: 1px solid var(--neon-lime);
            color: var(--neon-lime);
            background: rgba(163, 230, 53, 0.08);
            font-weight: 500;
            padding: 0.35em 0.8em;
        }
        .badge-programada {
            border: 1px solid var(--neon-purple);
            color: #D8B4FE;
            background: rgba(168, 85, 247, 0.1);
            font-weight: 500;
            padding: 0.35em 0.8em;
        }
        .form-control-dark {
            background-color: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: #FFF;
            border-radius: 10px;
        }
        .form-control-dark::placeholder {
            color: #6B7280;
        }
        .form-control-dark:focus {
            background-color: var(--bg-input);
            color: #FFF;
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple-glow);
        }
        .btn-neon-lime:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 18px var(--neon-lime-glow);
        }
        .btn-purple {
            background-color: var(--neon-purple) !important;
            color: #FFF !important;
            font-weight: 600;
            border: none;
            box-shadow: 0 0 12px var(--neon-purple-glow);
        }
        .btn-purple:hover {
            background-color: #9333EA !important;
            box-shadow: 0 0 18px var(--neon-purple-glow);
        }
        .text-subhead {
            color: var(--text-muted-custom) !important;
        }
        .text-banner-desc {
            color: var(--text-banner-sub) !important;
        }
        .btn-neon-lime {
            background-color: var(--neon-lime) !important;
            color: #07060B !important;
            font-weight: 700;
            border: none;
            box-shadow: 0 0 12px var(--neon-lime-glow);
            transition: all 0.2s ease;
        }
        .hero-banner {
            background: linear-gradient(135deg, #1D1035 0%, #0F1019 70%);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        .hero-banner::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--neon-purple-glow) 0%, transparent 70%);
            pointer-events: none;
        }
        .dark-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .sidebar-active-pink {
            background-color: var(--pink-soft) !important;
            color: #07060B !important;
            font-weight: 700;
            box-shadow: 0 0 12px var(--pink-soft-glow);
        }
        .sidebar-promo-card {
            background: linear-gradient(135deg, #1C132B 0%, #0F1019 100%);
            border: 1px solid rgba(229, 143, 229, 0.2);
            border-radius: 16px;
        }
        #sidebar-wrapper {
            width: 250px;
            min-height: 100vh;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
        }
        :root {
            --bg-main: #07060B;
            --bg-card: #0F1019;
            --bg-card-hover: #151724;
            --bg-sidebar: #0B0C12;
            --bg-input: #161722;
            --pink-soft: #E58FE5;
            --pink-soft-glow: rgba(229, 143, 229, 0.25);
            --neon-purple: #A855F7;
            --neon-purple-glow: rgba(168, 85, 247, 0.35);
            --neon-lime: #A3E635;
            --neon-lime-glow: rgba(163, 230, 53, 0.35);
            --neon-blue: #38BDF8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-muted-custom: #A1A1AA; 
            --text-banner-sub: #CBD5E1;   
        } 
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
       
        <!-- Main Content -->
        <div id="page-content-wrapper" class="w-100">
            <!-- Navbar Superior -->
            <nav class="navbar navbar-expand-lg navbar-dark bg-transparent py-3 px-4 border-bottom border-secondary border-opacity-25">
                <div class="container-fluid">
                    <div class="ms-auto d-flex align-items-center">
                        <div class="position-relative me-4 cursor-pointer text-white">
                            <i class="bi bi-bell fs-5"></i>
                            </div>
                        <div class="dropdown">
                            <div class="d-flex align-items-center cursor-pointer text-white" data-bs-toggle="dropdown">
                                <img src="../Assets/User.jpg" alt="Usuario" class="rounded-circle me-2" style="width: 35px; height: 35px; object-fit: cover;">
                                <span class="fw-bold small">Usuario <i class="bi bi-chevron-down ms-1 text-muted"></i></span>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
            <!-- Contenido Principal -->
            <div class="container-fluid px-4 py-4">
                
                <div class="d-flex align-items-center mb-4">
                    <a href="../index.html" class="btn-back me-3 text-decoration-none">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <div>
                        <h3 class="fw-bold text-white mb-0">Ver perfil</h3>
                        <p class="text-secondary small mb-0">Inicio / <span style="color: var(--neon-purple);">Ver perfil</span></p>
                    </div>
                </div>
                <!-- Banner de Perfil (Hero) -->
                <div class="profile-banner p-4 mb-4 d-flex align-items-center">
                    <div class="avatar-wrapper me-4">
                        <img src="../Assets/User.jpg" alt="Perfil" class="avatar-img">
                        <div class="avatar-edit-btn">
                            <i class="bi bi-camera-fill small"></i>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-white fw-bold mb-2"></h4>
                        <div class="d-flex align-items-center gap-3">
                            <span class="badge-rol"></span>
                            <span class="text-secondary small">Miembro desde: </span>
                        </div>
                    </div>
                </div>
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="dark-card p-4 h-100">
                            <div class="d-flex align-items-center mb-4">
                                <i class="bi bi-person fs-4 me-3" style="color: var(--neon-purple);"></i>
                                <div>
                                    <h5 class="text-white fw-bold mb-0">Información personal</h5>
                                    <p class="text-secondary small mb-0">Datos básicos de tu cuenta.</p>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Nombre completo</label>
                                <div class="input-icon-wrapper">
                                    <i class="bi bi-person"></i>
                                    <input type="text" class="form-control" value="">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Correo electrónico</label>
                                <div class="input-icon-wrapper">
                                    <i class="bi bi-envelope"></i>
                                    <input type="email" class="form-control" value="">
                                </div>
                            </div>
                            <div class="row mb-5">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label class="form-label text-secondary small">Cédula de identidad</label>
                                    <div class="input-icon-wrapper">
                                        <i class="bi bi-person-vcard"></i>
                                        <input type="text" class="form-control" value="">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-secondary small">Teléfono</label>
                                    <div class="input-icon-wrapper">
                                        <i class="bi bi-telephone"></i>
                                        <input type="text" class="form-control" value="">
                                    </div>
                                </div>
                            </div>
                            <hr class="border-secondary opacity-25 mb-4">
                            <!-- Sección: Cambiar Contraseña -->
                            <div class="d-flex align-items-center mb-4">
                                <i class="bi bi-lock fs-4 me-3" style="color: var(--neon-purple);"></i>
                                <div>
                                    <h5 class="text-white fw-bold mb-0">Cambiar contraseña</h5>
                                    <p class="text-secondary small mb-0">Deja los campos en blanco si no deseas cambiar tu contraseña.</p>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-secondary small">Contraseña actual</label>
                                    <div class="input-icon-wrapper pe-3">
                                        <input type="password" class="form-control ps-0" placeholder="Ingresa tu contraseña actual">
                                        <i class="bi bi-eye ms-auto" style="cursor: pointer;"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-secondary small">Nueva contraseña</label>
                                    <div class="input-icon-wrapper pe-3">
                                        <i class="bi bi-lock me-2"></i>
                                        <input type="password" class="form-control ps-0" placeholder="Ingresa una nueva contraseña">
                                        <i class="bi bi-eye ms-auto" style="cursor: pointer;"></i>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-secondary small">Confirmar nueva contraseña</label>
                                    <div class="input-icon-wrapper pe-3">
                                        <i class="bi bi-lock me-2"></i>
                                        <input type="password" class="form-control ps-0" placeholder="Confirma la nueva contraseña">
                                        <i class="bi bi-eye ms-auto" style="cursor: pointer;"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Columna Derecha: Resumen de Usuario -->
                    <div class="col-lg-4">
                        <div class="dark-card p-4 h-100">
                            <!-- Imagen decorativa del auto neón verde -->
                            <img src="../Assets/AutoVerde.png" alt="Auto" class="img-fluid rounded-3 mb-4 w-100" style="border: 1px solid rgba(163, 230, 53, 0.2); object-fit: cover; height: 140px;">
                            
                            <div class="d-flex align-items-center mb-4">
                                <i class="bi bi-person-lines-fill fs-5 me-2 text-white"></i>
                                <h6 class="text-white fw-bold mb-0">Información del usuario</h6>
                            </div>
                            
                            <div class="d-flex justify-content-between py-2 border-bottom border-secondary border-opacity-10 small mb-2">
                                <span class="text-secondary"><i class="bi bi-person me-2"></i> Rol</span>
                                <span class="text-white"></span>
                            </div>
                            <div class="d-flex justify-content-between py-2 border-bottom border-secondary border-opacity-10 small mb-2">
                                <span class="text-secondary"><i class="bi bi-check-circle me-2"></i> Estado</span>
                                <span class="badge badge-activa">__</span>
                            </div>
                            <div class="d-flex justify-content-between py-2 border-bottom border-secondary border-opacity-10 small mb-4">
                                <span class="text-secondary"><i class="bi bi-calendar-event me-2"></i> Fecha de registro</span>
                                <span class="text-white"></span>
                            </div>

                            <div class="d-flex align-items-center mb-4 mt-2">
                                <i class="bi bi-gear fs-5 me-2" style="color: var(--neon-purple);"></i>
                                <h6 class="text-white fw-bold mb-0">Preferencias</h6>
                            </div>

                            <div class="d-flex justify-content-between align-items-center p-3 rounded-3" style="background-color: var(--bg-input); border: 1px solid var(--border-subtle);">
                                <span class="text-secondary small"><i class="bi bi-envelope me-2"></i> Notificaciones por correo</span>
                                <div class="form-check form-switch m-0 p-0 d-flex align-items-center">
                                    <input class="form-check-input ms-0" type="checkbox" role="switch" checked>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Footer (Botones de Acción) -->
                <div class="d-flex justify-content-end gap-3 mt-4 p-3 rounded-3 dark-card">
                    <button class="btn text-white bg-transparent" style="border: 1px solid var(--border-subtle); padding: 0.5rem 1.5rem;">Cancelar</button>
                    <button class="btn btn-neon-lime d-flex align-items-center gap-2" style="padding: 0.5rem 1.5rem;">
                        <i class="bi bi-device-hdd"></i> Guardar cambios
                    </button>
                </div>

            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
